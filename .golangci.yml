run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gofmt
    - goimports
    - gosimple
    - typecheck

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  misspell:
    locale: US
  gofmt:
    simplify: true
  goimports:
    local-prefixes: gooffer/backend

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - frontend
    - vendor
    - node_modules
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - staticcheck
        - unused
    - path: main\.go
      text: "Error return value of .* is not checked"