services:

  redis:
    image: redis:8.0-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - result_year

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
      TZ: Europe/Moscow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - result_year

  backend:
    container_name: backend_result_year
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      GIN_MODE: release
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DATABASE}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - result_year
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    volumes:
      - ./docker/config/nginx/${NGINX_FILE}:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    environment:
      NGINX_NAME: ${NGINX_FILE}
      TZ: Europe/Moscow
    depends_on:
      - backend
    networks:
      - result_year


volumes:
  postgres_data:
  redis_data:
  uploads:
  backend_logs:

networks:
  result_year:
    external: true
    driver: bridge
