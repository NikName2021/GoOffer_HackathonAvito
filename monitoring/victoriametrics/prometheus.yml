global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: application
    static_configs:
      - targets:
          - backend:8000
        labels:
          environment: production

  - job_name: victoriametrics
    static_configs:
      - targets:
          - victoriametrics:8428

  - job_name: vmagent
    static_configs:
      - targets:
          - vmagent:8429

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100