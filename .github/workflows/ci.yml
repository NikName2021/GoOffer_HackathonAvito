name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run tests
        run: go test -mod=readonly ./...

      - name: Measure business-logic coverage
        run: >-
          go test -mod=readonly
          -coverpkg=./internal/usecase/...
          -coverprofile=coverage.out
          ./internal/usecase/... ./tests/unit/...

      - name: Enforce 75% business-logic coverage
        shell: bash
        run: |
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          if [[ -z "$coverage" ]]; then
            echo "::error::Unable to read total coverage from coverage.out"
            exit 1
          fi
          echo "Business-logic coverage: ${coverage}%"
          if ! awk -v coverage="$coverage" 'BEGIN { exit !(coverage >= 75) }'; then
            echo "::error::Business-logic coverage ${coverage}% is below the required 75%"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  postgres-integration:
    name: PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: result_year
          POSTGRES_PASSWORD: integration_password
          POSTGRES_DB: result_year
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U result_year -d result_year"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: result_year
      DB_PASSWORD: integration_password
      DB_NAME: result_year
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run real repository and API flow tests
        run: go test -mod=readonly -count=1 ./tests/integration/...

  openapi:
    name: OpenAPI validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate Swagger
        env:
          REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
          REDOCLY_TELEMETRY: "off"
        run: npx --yes @redocly/cli@2.41.1 lint --config redocly.yaml docs/swagger.yaml

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Read pinned golangci-lint version
        id: golangci-version
        run: echo "version=$(cat backend/.golangci-version)" >> "$GITHUB_OUTPUT"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.golangci-version.outputs.version }}
          working-directory: backend

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test -- --ci --runInBand

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  compose-smoke-test:
    name: Docker Compose smoke test
    if: github.event_name == 'push'
    needs:
      - go-tests
      - postgres-integration
      - openapi
      - golangci-lint
      - frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Create network
        run: docker network create result_year

      - name: Build and start containers
        run: >-
          docker compose --env-file .env.example up
          --build --wait --wait-timeout 180

      - name: Show container status
        run: docker compose --env-file .env.example ps

      - name: Check backend health
        run: >-
          curl --fail --silent --show-error
          --retry 10 --retry-delay 2
          http://127.0.0.1:8000/health

      - name: Check frontend
        run: >-
          curl --fail --silent --show-error
          --retry 10 --retry-delay 2
          http://127.0.0.1/

      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color

      - name: Stop containers
        if: always()
        run: >-
          docker compose --env-file .env.example down
          --volumes --remove-orphans
