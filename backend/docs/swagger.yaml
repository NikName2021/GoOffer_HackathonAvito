openapi: 3.0.3
info:
  title: Avito Recap API
  version: 1.0.0
  description: API аккаунтов, пользовательских профилей и персональных «Итогов года».
servers:
  - url: /
tags:
  - name: System
  - name: Auth
  - name: Profiles
  - name: Recap
paths:
  /health:
    get:
      tags: [System]
      summary: Проверка доступности сервиса
      operationId: health
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /metrics:
    get:
      tags: [System]
      summary: Получить метрики приложения в формате Prometheus
      operationId: metrics
      responses:
        "200":
          description: Runtime, process и HTTP-метрики приложения
          content:
            text/plain:
              schema:
                type: string
                example: |-
                  # HELP gooffer_http_requests_total Total number of HTTP requests processed by the application.
                  # TYPE gooffer_http_requests_total counter
                  gooffer_http_requests_total{code="200",method="GET"} 1
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Зарегистрировать аккаунт
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Аккаунт создан, сессия установлена в HttpOnly-cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Войти по логину и паролю
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Вход выполнен, сессия установлена в HttpOnly-cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Завершить текущую сессию
      operationId: logout
      responses:
        "204":
          description: Сессия завершена
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Получить текущий аккаунт
      operationId: currentAccount
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Текущий аккаунт
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/profiles:
    get:
      tags: [Profiles]
      summary: Получить профили текущего аккаунта
      operationId: listProfiles
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Список профилей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Profiles]
      summary: Создать профиль и рассчитать его аналитику
      operationId: createProfile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileWrite"
      responses:
        "201":
          description: Профиль создан; вычисляемые поля возвращены в ответе
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/profiles/{id}:
    get:
      tags: [Profiles]
      summary: Получить профиль с рассчитанной аналитикой
      operationId: getProfile
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProfileID"
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Profiles]
      summary: Полностью изменить профиль и пересчитать аналитику
      operationId: updateProfile
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProfileID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileWrite"
      responses:
        "200":
          description: Профиль и вычисляемые итоги обновлены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Profiles]
      summary: Удалить профиль
      operationId: deleteProfile
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProfileID"
      responses:
        "204":
          description: Профиль удалён
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/recap/generate:
    post:
      tags: [Recap]
      summary: Сгенерировать итоги года
      operationId: generateRecap
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRecapRequest"
      responses:
        "201":
          description: Итоги сформированы и сохранены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recap"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/recap/{user_id}/{year}:
    get:
      tags: [Recap]
      summary: Получить ранее сгенерированные итоги
      operationId: getRecap
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: Полные личные итоги
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recap"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/recap/{user_id}/{year}/share:
    get:
      tags: [Recap]
      summary: Получить безопасную share-card
      description: Ответ содержит только агрегаты и не раскрывает ID пользователя или recap. Доступ разрешён владельцу профиля.
      operationId: getShareRecap
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: Данные публичной карточки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareRecap"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gooffer_session
  parameters:
    ProfileID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Year:
      name: year
      in: path
      required: true
      schema:
        type: integer
        minimum: 2000
        example: 2026
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[\\p{L}\\p{N}_.-]+$"
          example: nikita
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          example: avito2026
    Account:
      type: object
      required: [id, login, createdAt]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
          example: nikita
        createdAt:
          type: string
          format: date-time
    ProfileWrite:
      type: object
      additionalProperties: false
      required: [name, joinedAt, likes, chatsCount, views, ownAds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Анна Смирнова
        joinedAt:
          type: string
          format: date
          example: "2018-04-14"
        avatarUrl:
          type: string
          description: HTTP(S) URL или data URL изображения PNG/JPG/WEBP.
        likes:
          type: integer
          minimum: 0
          example: 148
        chatsCount:
          type: integer
          minimum: 0
          example: 43
        views:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/ViewedAdWrite"
        ownAds:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/OwnAdWrite"
    AdWriteBase:
      type: object
      required: [title, category, price, viewCount]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        category: {type: string, minLength: 1, maxLength: 100}
        subcategory: {type: string}
        imageUrl: {type: string}
        price: {type: integer, format: int64, minimum: 0}
        viewCount: {type: integer, minimum: 0}
    ViewedAdWrite:
      allOf:
        - $ref: "#/components/schemas/AdWriteBase"
        - type: object
          required: [lastViewedAt, isFavorite, isPurchased]
          properties:
            lastViewedAt: {type: string, format: date-time}
            isFavorite: {type: boolean}
            favoritedAt:
              type: string
              format: date-time
              description: Обязательно, когда isFavorite=true.
            isPurchased: {type: boolean}
            purchasedAt:
              type: string
              format: date-time
              description: Обязательно, когда isPurchased=true.
    OwnAdWrite:
      allOf:
        - $ref: "#/components/schemas/AdWriteBase"
        - type: object
          required: [isArchived, isSold]
          properties:
            isArchived: {type: boolean}
            isSold: {type: boolean}
            soldAt:
              type: string
              format: date
              description: Обязательно, когда isSold=true.
            review:
              $ref: "#/components/schemas/ProfileReview"
    ProfileReview:
      type: object
      required: [comment, rating, createdAt]
      properties:
        comment: {type: string, minLength: 1, maxLength: 2000}
        rating: {type: integer, minimum: 1, maximum: 5}
        createdAt: {type: string, format: date}
    Profile:
      type: object
      description: Исходные views и ownAds можно без потерь использовать для PUT; статистика и highlights всегда рассчитываются сервером из этих массивов.
      required: [id, name, joinedAt, views, ownAds, stats, highlights, purchases, sales]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        joinedAt: {type: string, format: date}
        avatarUrl: {type: string}
        views:
          type: array
          description: Полный исходный массив просмотров в формате, принимаемом PUT.
          items:
            $ref: "#/components/schemas/ViewedAdWrite"
        ownAds:
          type: array
          description: Полный исходный массив объявлений в формате, принимаемом PUT.
          items:
            $ref: "#/components/schemas/OwnAdWrite"
        stats:
          $ref: "#/components/schemas/ProfileStats"
        highlights:
          $ref: "#/components/schemas/ProfileHighlights"
        purchases:
          type: array
          items:
            $ref: "#/components/schemas/ProfilePurchase"
        sales:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSale"
    ProfileStats:
      type: object
      required: [likes, chatsCount, purchasesCount, salesCount, totalViewCount, totalSpent, totalEarned, reviewsCount, averageRating]
      properties:
        likes: {type: integer, minimum: 0}
        chatsCount: {type: integer, minimum: 0}
        purchasesCount: {type: integer, minimum: 0}
        salesCount: {type: integer, minimum: 0}
        totalViewCount: {type: integer, minimum: 0}
        totalSpent: {type: integer, format: int64, minimum: 0}
        totalEarned: {type: integer, format: int64, minimum: 0}
        reviewsCount: {type: integer, minimum: 0}
        averageRating: {type: number, format: double, nullable: true, minimum: 1, maximum: 5}
    ProfileHighlights:
      type: object
      required: [favoriteCategory, mostExpensivePurchase, leastExpensivePurchase, mostExpensiveSale, leastExpensiveSale]
      properties:
        favoriteCategory: {type: string, nullable: true}
        mostExpensivePurchase:
          allOf: [{$ref: "#/components/schemas/ProfilePurchase"}]
          nullable: true
        leastExpensivePurchase:
          allOf: [{$ref: "#/components/schemas/ProfilePurchase"}]
          nullable: true
        mostExpensiveSale:
          allOf: [{$ref: "#/components/schemas/ProfileSale"}]
          nullable: true
        leastExpensiveSale:
          allOf: [{$ref: "#/components/schemas/ProfileSale"}]
          nullable: true
    ProfilePurchase:
      type: object
      required: [title, category, price, purchasedAt]
      properties:
        title: {type: string}
        category: {type: string}
        subcategory: {type: string}
        imageUrl: {type: string}
        price: {type: integer, format: int64, minimum: 0}
        purchasedAt: {type: string, format: date-time}
    ProfileSale:
      type: object
      required: [title, category, price, soldAt, viewCount, review]
      properties:
        title: {type: string}
        category: {type: string}
        subcategory: {type: string}
        imageUrl: {type: string}
        price: {type: integer, format: int64, minimum: 0}
        soldAt: {type: string, format: date}
        viewCount: {type: integer, minimum: 0}
        review:
          allOf: [{$ref: "#/components/schemas/ProfileReview"}]
          nullable: true
    GenerateRecapRequest:
      type: object
      additionalProperties: false
      required: [user_id, year]
      properties:
        user_id:
          type: string
          format: uuid
        year:
          type: integer
          minimum: 2000
          example: 2026
    CategoryStat:
      type: object
      required: [category, count]
      properties:
        category:
          type: string
          example: Электроника
        count:
          type: integer
          minimum: 0
          example: 300
          description: Количество item-level сигналов без весовых коэффициентов.
    Achievement:
      type: object
      required: [slug, title, description, icon, category]
      properties:
        slug:
          type: string
          example: curious
        title:
          type: string
          example: Любопытный
        description:
          type: string
          example: Просмотрел не менее 500 объявлений за год
        icon:
          type: string
          example: 👀
        category:
          type: string
          example: views
    RecapItem:
      type: object
      required: [title, category, price]
      properties:
        title: {type: string, example: Смартфон}
        category: {type: string, example: Электроника}
        subcategory: {type: string, example: Смартфоны}
        image_url: {type: string, format: uri}
        price: {type: integer, format: int64, minimum: 0, example: 118000}
    BuyerRecapSummary:
      type: object
      required: [has_data, viewed_ads_count, total_views, favorites_count, chats_count, purchases_count]
      properties:
        has_data: {type: boolean}
        viewed_ads_count: {type: integer, minimum: 0}
        total_views: {type: integer, minimum: 0}
        favorites_count: {type: integer, minimum: 0}
        chats_count:
          type: integer
          minimum: 0
          description: Текущий агрегированный снимок профиля; у исходного поля пока нет даты.
        purchases_count: {type: integer, minimum: 0}
        main_category: {type: string}
        largest_purchase:
          allOf: [{$ref: "#/components/schemas/RecapItem"}]
          nullable: true
    SellerRecapSummary:
      type: object
      required:
        - has_data
        - listings_count
        - active_listings
        - archived_listings
        - sales_count
        - listing_views
        - likes_received
        - reviews_count
      properties:
        has_data: {type: boolean}
        listings_count:
          type: integer
          minimum: 0
          description: Текущий снимок ownAds; дата публикации пока отсутствует.
        active_listings: {type: integer, minimum: 0}
        archived_listings: {type: integer, minimum: 0}
        sales_count: {type: integer, minimum: 0}
        listing_views: {type: integer, minimum: 0}
        likes_received: {type: integer, minimum: 0}
        reviews_count: {type: integer, minimum: 0}
        average_rating:
          type: number
          format: double
          minimum: 1
          maximum: 5
          nullable: true
        main_category: {type: string}
        star_listing:
          allOf: [{$ref: "#/components/schemas/RecapItem"}]
          nullable: true
    CombinedRecapSummary:
      type: object
      required: [has_buyer_data, has_seller_data, categories_count, deals_count]
      properties:
        has_buyer_data: {type: boolean}
        has_seller_data: {type: boolean}
        categories_count: {type: integer, minimum: 0}
        deals_count: {type: integer, minimum: 0}
        main_category: {type: string}
    RecapSummary:
      type: object
      required: [headline, description, buyer, seller, combined]
      properties:
        headline: {type: string, example: Вы были по обе стороны Авито}
        description: {type: string}
        buyer: {$ref: "#/components/schemas/BuyerRecapSummary"}
        seller: {$ref: "#/components/schemas/SellerRecapSummary"}
        combined: {$ref: "#/components/schemas/CombinedRecapSummary"}
    ShareRecapSummary:
      type: object
      required: [headline, description, combined]
      properties:
        headline: {type: string}
        description: {type: string}
        combined: {$ref: "#/components/schemas/CombinedRecapSummary"}
    RecapCardPresentation:
      type: object
      required: [layout, theme, icon]
      properties:
        layout:
          type: string
          example: statistic
        theme:
          type: string
          example: avito-purple
        icon:
          type: string
          example: sparkles
    RecapCardCTA:
      type: object
      required: [label, action]
      properties:
        label: {type: string, example: Открыть свежие объявления}
        action: {type: string, example: open_category}
        params:
          type: object
          additionalProperties: {type: string}
          example: {category: Электроника}
    RecapCard:
      type: object
      required: [id, kind, title, description, shareable, reason, presentation]
      properties:
        id: {type: string, example: main_interest}
        kind:
          type: string
          enum: [overview, interest, buyer, seller, combined, final]
        eyebrow: {type: string, example: Главный интерес}
        title: {type: string, example: Электроника}
        description: {type: string}
        value: {type: string, example: 12 находок}
        image_url: {type: string, format: uri}
        shareable:
          type: boolean
          description: Backend-флаг; публичный share endpoint сам исключает false-карточки.
        reason:
          type: string
          description: Объяснение, почему карточка вошла в итоговую последовательность.
        presentation: {$ref: "#/components/schemas/RecapCardPresentation"}
        cta:
          allOf: [{$ref: "#/components/schemas/RecapCardCTA"}]
          nullable: true
    RecapMetrics:
      type: object
      required:
        - year
        - total_views
        - total_messages
        - total_favorites
        - total_purchases
        - total_sales
        - top_categories
        - achievements
        - activity_days
        - generated_at
      properties:
        year:
          type: integer
          example: 2026
        total_views:
          type: integer
          minimum: 0
          example: 1500
          description: Сумма viewCount для объявлений с lastViewedAt в выбранном году.
        total_messages:
          type: integer
          minimum: 0
          example: 50
          description: Текущий chatsCount профиля; годовой timestamp пока отсутствует.
        total_favorites:
          type: integer
          minimum: 0
          example: 100
          description: Избранное с favoritedAt в выбранном году.
        total_purchases:
          type: integer
          minimum: 0
          example: 10
          description: Покупки с purchasedAt в выбранном году.
        total_sales:
          type: integer
          minimum: 0
          example: 5
          description: Продажи с soldAt в выбранном году.
        top_categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryStat"
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/Achievement"
        activity_days:
          type: integer
          minimum: 0
          maximum: 366
          example: 300
        generated_at:
          type: string
          format: date-time
    Recap:
      allOf:
        - $ref: "#/components/schemas/RecapMetrics"
        - type: object
          required: [id, user_id, summary, cards]
          properties:
            id:
              type: string
              format: uuid
            user_id:
              type: string
              format: uuid
            summary:
              $ref: "#/components/schemas/RecapSummary"
            cards:
              type: array
              items: {$ref: "#/components/schemas/RecapCard"}
    ShareRecap:
      allOf:
        - $ref: "#/components/schemas/RecapMetrics"
        - type: object
          required: [summary, cards]
          properties:
            summary: {$ref: "#/components/schemas/ShareRecapSummary"}
            cards:
              type: array
              description: Только карточки с shareable=true.
              items: {$ref: "#/components/schemas/RecapCard"}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_request
            message:
              type: string
              example: request body must be valid JSON with user_id and year
            request_id:
              type: string
  responses:
    BadRequest:
      description: Некорректные параметры запроса
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Требуется действующая сессия
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Логин уже занят
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
