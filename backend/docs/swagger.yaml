openapi: 3.0.3
info:
  title: Avito Recap API
  version: 1.0.0
  description: |-
    API аккаунтов, пользовательских профилей и персональных «Итогов года».
    Все `/api/profiles`, `/api/recap` и mission endpoint доступны только владельцу
    профиля по обязательной cookie `gooffer_session`. Публичных ссылок в MVP нет.
servers:
  - url: /
tags:
  - name: System
    description: Диагностика доступности и метрики приложения.
  - name: Auth
    description: Регистрация, вход, выход и получение текущего аккаунта.
  - name: Profiles
    description: Управление профилями текущего аккаунта.
  - name: Recap
    description: Генерация и просмотр персональных итогов года.
  - name: Admin
    description: Управление встроенными ачивками и правилами дополнительных Recap-карточек; требуется аккаунт администратора.
paths:
  /health:
    get:
      tags: [System]
      summary: Проверка доступности сервиса
      operationId: health
      security: []
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /metrics:
    get:
      tags: [System]
      summary: Получить метрики приложения в формате Prometheus
      operationId: metrics
      security: []
      responses:
        "200":
          description: Runtime, process и HTTP-метрики приложения
          content:
            text/plain:
              schema:
                type: string
                example: |-
                  # HELP gooffer_http_requests_total Total number of HTTP requests processed by the application.
                  # TYPE gooffer_http_requests_total counter
                  gooffer_http_requests_total{code="200",method="GET"} 1
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Зарегистрировать аккаунт
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Аккаунт создан, сессия установлена в HttpOnly-cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Войти по логину и паролю
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Вход выполнен, сессия установлена в HttpOnly-cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Завершить текущую сессию
      operationId: logout
      security: []
      responses:
        "204":
          description: Сессия завершена
        "500":
          $ref: "#/components/responses/InternalError"
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Получить текущий аккаунт
      operationId: currentAccount
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Текущий аккаунт
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/profiles:
    get:
      tags: [Profiles]
      summary: Получить профили текущего аккаунта
      operationId: listProfiles
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Список профилей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Profiles]
      summary: Создать профиль и рассчитать его аналитику
      operationId: createProfile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileWrite"
      responses:
        "201":
          description: Профиль создан; вычисляемые поля возвращены в ответе
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/profiles/{id}:
    get:
      tags: [Profiles]
      summary: Получить профиль с рассчитанной аналитикой
      operationId: getProfile
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProfileID"
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Profiles]
      summary: Полностью изменить профиль и пересчитать аналитику
      operationId: updateProfile
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProfileID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileWrite"
      responses:
        "200":
          description: Профиль и вычисляемые итоги обновлены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Profiles]
      summary: Удалить профиль
      operationId: deleteProfile
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ProfileID"
      responses:
        "204":
          description: Профиль удалён
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/recap/generate:
    post:
      tags: [Recap]
      summary: Сгенерировать итоги года
      description: Генерация разрешена только для профиля текущего аккаунта. Повторный вызов атомарно заменяет сохранённый recap и запись Redis-кэша.
      operationId: generateRecap
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRecapRequest"
      responses:
        "201":
          description: Итоги сформированы и сохранены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recap"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/recap/{user_id}/{year}:
    get:
      tags: [Recap]
      summary: Получить ранее сгенерированные итоги
      description: Доступ разрешён только владельцу профиля.
      operationId: getRecap
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: Полные личные итоги
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recap"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/recap/{user_id}/{year}/share:
    get:
      tags: [Recap]
      summary: Получить безопасную share-card
      description: |-
        Аутентифицированный экспорт для PNG/текста, доступный только владельцу профиля.
        Это не публичная ссылка. Карточки формируются по allowlist и не содержат ID,
        CTA, технические причины, диаграммы, названия/изображения собственных объявлений.
      operationId: getShareRecap
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: Безопасные данные для экспорта владельцем
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareRecap"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/recap/events:
    post:
      tags: [Recap]
      summary: Зафиксировать бизнес-событие recap или миссии
      description: Принимает только события из фиксированного списка и не добавляет идентификаторы пользователя в Prometheus labels.
      operationId: trackRecapEvent
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecapBusinessEvent"
      responses:
        "204":
          description: Событие зарегистрировано
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/recap/{user_id}/{year}/mission:
    get:
      tags: [Recap]
      summary: Получить миссии и прогресс выбранной цели
      description: Backend пересчитывает прогресс по событиям профиля после selected_at и сохраняет новое состояние.
      operationId: getRecapMission
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: Каталог миссий и выбранная цель; selected равен null до выбора
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Recap]
      summary: Выбрать миссию на следующий год
      description: Повторный выбор того же кода идемпотентен. Другой код заменяет активную миссию и начинает её с нуля.
      operationId: selectRecapMission
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/Year"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectMissionRequest"
      responses:
        "200":
          description: Обновлённый каталог и выбранная миссия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/card-definitions/options:
    get:
      tags: [Admin]
      summary: Получить доступные настройки конструктора карточек
      operationId: getCardDefinitionOptions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Допустимые метрики, способы анализа и условия
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDefinitionOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/card-definitions:
    get:
      tags: [Admin]
      summary: Получить созданные шаблоны карточек
      operationId: listCardDefinitions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Все глобальные и пользовательские шаблоны
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CardDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Admin]
      summary: Создать шаблон пользовательской Recap-карточки
      description: target_user_id ограничивает шаблон одним профилем; без него правило действует для всех профилей.
      operationId: createCardDefinition
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardDefinition"
      responses:
        "201":
          description: Шаблон создан и будет применён при следующей генерации Recap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/card-definitions/{id}:
    put:
      tags: [Admin]
      summary: Полностью обновить шаблон карточки
      operationId: updateCardDefinition
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardDefinition"
      responses:
        "200":
          description: Обновлённый шаблон
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Admin]
      summary: Удалить шаблон карточки
      operationId: deleteCardDefinition
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: Шаблон удалён
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/achievement-definitions/options:
    get:
      tags: [Admin]
      summary: Получить доступные метрики и условия для встроенных ачивок
      operationId: getAchievementDefinitionOptions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Допустимые метрики и операторы условий
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AchievementDefinitionOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/achievement-definitions:
    get:
      tags: [Admin]
      summary: Получить определения встроенных ачивок
      operationId: listAchievementDefinitions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Все встроенные ачивки, включая отключённые
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AchievementDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/admin/achievement-definitions/{slug}:
    put:
      tags: [Admin]
      summary: Обновить существующую встроенную ачивку
      description: Системные поля slug, category и sort_order остаются неизменными. Изменение применяется при следующей генерации Recap.
      operationId: updateAchievementDefinition
      security:
        - cookieAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
            pattern: ^[a-z0-9_]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAchievementDefinition"
      responses:
        "200":
          description: Обновлённое определение ачивки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AchievementDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gooffer_session
      description: Обязательная HttpOnly SameSite=Lax cookie; в production также Secure.
  parameters:
    ProfileID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Year:
      name: year
      in: path
      required: true
      schema:
        type: integer
        minimum: 2000
        example: 2026
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[\\p{L}\\p{N}_.-]+$"
          example: nikita
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          writeOnly: true
          example: avito2026
    Account:
      type: object
      required: [id, login, isAdmin, createdAt]
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
          example: nikita
        isAdmin:
          type: boolean
          description: Разрешён ли доступ к административному API. Для демонстрационного аккаунта nikita — true.
        createdAt:
          type: string
          format: date-time
    ProfileWrite:
      type: object
      description: Полная замена профиля. Размер JSON-тела не должен превышать 32 MiB.
      additionalProperties: false
      required: [name, joinedAt, likes, chatsCount, views, ownAds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Анна Смирнова
        joinedAt:
          type: string
          format: date
          example: "2018-04-14"
        avatarUrl:
          type: string
          description: HTTP(S) URL или data URL изображения PNG/JPG/WEBP.
        likes:
          type: integer
          minimum: 0
          example: 148
        chatsCount:
          type: integer
          minimum: 0
          example: 43
        views:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/ViewedAdWrite"
        ownAds:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/OwnAdWrite"
    AdWriteBase:
      type: object
      required: [adId, title, category, price, viewCount]
      properties:
        adId:
          type: string
          minLength: 1
          maxLength: 100
          description: Уникальный ID объявления, который генерирует frontend.
        title: {type: string, minLength: 1, maxLength: 200}
        category: {type: string, minLength: 1, maxLength: 100}
        subcategory: {type: string}
        imageUrl: {type: string}
        price: {type: integer, format: int64, minimum: 0}
        viewCount: {type: integer, minimum: 0}
    ViewedAdWrite:
      allOf:
        - $ref: "#/components/schemas/AdWriteBase"
        - type: object
          required: [viewedAt]
          properties:
            viewedAt:
              type: array
              minItems: 1
              maxItems: 10000
              items: {$ref: "#/components/schemas/ViewedAdEvent"}
            lastViewedAt:
              type: string
              format: date-time
              readOnly: true
              description: Рассчитывается backend по последнему watch-событию.
            isFavorite:
              type: boolean
              readOnly: true
            favoritedAt:
              type: string
              format: date-time
              readOnly: true
            isPurchased:
              type: boolean
              readOnly: true
            purchasedAt:
              type: string
              format: date-time
              readOnly: true
    ViewedAdEvent:
      type: object
      additionalProperties: false
      required: [type, time]
      properties:
        type:
          type: string
          enum: [watch, like, buy]
        time:
          type: string
          format: date-time
        useAvitoDelivery:
          type: boolean
          description: Обязательно для type=buy; запрещено для watch и like.
    OwnAdWrite:
      allOf:
        - $ref: "#/components/schemas/AdWriteBase"
        - type: object
          required: [publishedAt, favoritesCount, contactsCount, isArchived, isSold]
          properties:
            publishedAt: {type: string, format: date}
            favoritesCount: {type: integer, minimum: 0}
            contactsCount: {type: integer, minimum: 0}
            city:
              type: string
              maxLength: 100
              description: Необязательный город объявления.
            isArchived: {type: boolean}
            isSold: {type: boolean}
            soldAt:
              type: string
              format: date
              description: Обязательно, когда isSold=true.
            review:
              $ref: "#/components/schemas/ProfileReview"
    ProfileReview:
      type: object
      required: [comment, rating, createdAt]
      properties:
        comment: {type: string, minLength: 1, maxLength: 2000}
        rating: {type: integer, minimum: 1, maximum: 5}
        createdAt: {type: string, format: date}
    Profile:
      type: object
      description: Исходные views и ownAds можно без потерь использовать для PUT; статистика и highlights всегда рассчитываются сервером из этих массивов.
      required: [id, name, joinedAt, views, ownAds, stats, highlights, purchases, sales]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        joinedAt: {type: string, format: date}
        avatarUrl: {type: string}
        views:
          type: array
          description: Полный исходный массив просмотров в формате, принимаемом PUT.
          items:
            $ref: "#/components/schemas/ViewedAdWrite"
        ownAds:
          type: array
          description: Полный исходный массив объявлений в формате, принимаемом PUT.
          items:
            $ref: "#/components/schemas/OwnAdWrite"
        stats:
          $ref: "#/components/schemas/ProfileStats"
        highlights:
          $ref: "#/components/schemas/ProfileHighlights"
        purchases:
          type: array
          items:
            $ref: "#/components/schemas/ProfilePurchase"
        sales:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSale"
    ProfileStats:
      type: object
      required: [likes, chatsCount, purchasesCount, salesCount, totalViewCount, totalSpent, totalEarned, reviewsCount, averageRating]
      properties:
        likes: {type: integer, minimum: 0}
        chatsCount: {type: integer, minimum: 0}
        purchasesCount: {type: integer, minimum: 0}
        salesCount: {type: integer, minimum: 0}
        totalViewCount: {type: integer, minimum: 0}
        totalSpent: {type: integer, format: int64, minimum: 0}
        totalEarned: {type: integer, format: int64, minimum: 0}
        reviewsCount: {type: integer, minimum: 0}
        averageRating: {type: number, format: double, nullable: true, minimum: 1, maximum: 5}
    ProfileHighlights:
      type: object
      required: [favoriteCategory, mostExpensivePurchase, leastExpensivePurchase, mostExpensiveSale, leastExpensiveSale]
      properties:
        favoriteCategory: {type: string, nullable: true}
        mostExpensivePurchase:
          type: object
          allOf: [{$ref: "#/components/schemas/ProfilePurchase"}]
          nullable: true
        leastExpensivePurchase:
          type: object
          allOf: [{$ref: "#/components/schemas/ProfilePurchase"}]
          nullable: true
        mostExpensiveSale:
          type: object
          allOf: [{$ref: "#/components/schemas/ProfileSale"}]
          nullable: true
        leastExpensiveSale:
          type: object
          allOf: [{$ref: "#/components/schemas/ProfileSale"}]
          nullable: true
    ProfilePurchase:
      type: object
      required: [adId, title, category, price, purchasedAt]
      properties:
        adId: {type: string}
        title: {type: string}
        category: {type: string}
        subcategory: {type: string}
        imageUrl: {type: string}
        price: {type: integer, format: int64, minimum: 0}
        purchasedAt: {type: string, format: date-time}
    ProfileSale:
      type: object
      required: [adId, title, category, price, soldAt, viewCount, review]
      properties:
        adId: {type: string}
        title: {type: string}
        category: {type: string}
        subcategory: {type: string}
        imageUrl: {type: string}
        price: {type: integer, format: int64, minimum: 0}
        soldAt: {type: string, format: date}
        viewCount: {type: integer, minimum: 0}
        review:
          type: object
          allOf: [{$ref: "#/components/schemas/ProfileReview"}]
          nullable: true
    CreateCardDefinition:
      type: object
      additionalProperties: false
      required: [name, metric, title]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, example: Активный покупатель}
        target_user_id:
          type: string
          format: uuid
          nullable: true
          description: Не указывать для глобальной карточки.
        kind:
          type: string
          enum: [statistic, highlight]
          default: statistic
          description: Тип шаблона; преобразуется backend в поддерживаемый фронтендом вид карточки.
        metric:
          type: string
          enum: [total_views, favorites, purchases, sales, listing_views, contacts, reviews, activity_days, categories, deals]
        analysis:
          type: string
          enum: [total, monthly_average, monthly_max]
          default: total
        condition_operator:
          type: string
          enum: [always, gt, gte, lt, lte, eq]
          default: always
        condition_value:
          type: number
          format: double
          nullable: true
          description: Обязательно для всех условий, кроме always.
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 500, default: ""}
        value_suffix: {type: string, maxLength: 40, default: ""}
        layout:
          type: string
          enum: [statistic, hero]
          description: По умолчанию statistic; для kind=highlight — hero.
        theme: {type: string, minLength: 1, maxLength: 50, default: avito-purple}
        icon: {type: string, minLength: 1, maxLength: 50, default: chart}
        shareable: {type: boolean, default: true}
        sort_order: {type: integer, minimum: 0, default: 100}
        is_active: {type: boolean, default: true}
    CardDefinition:
      allOf:
        - $ref: "#/components/schemas/CreateCardDefinition"
        - type: object
          required: [id, kind, analysis, condition_operator, description, value_suffix, layout, theme, icon, shareable, sort_order, is_active, created_by, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            created_by: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    CardDefinitionOptions:
      type: object
      required: [kinds, metrics, analyses, conditions, layouts, monthly_metrics]
      properties:
        kinds:
          type: array
          items: {type: string, enum: [statistic, highlight]}
        metrics:
          type: array
          items: {type: string, enum: [total_views, favorites, purchases, sales, listing_views, contacts, reviews, activity_days, categories, deals]}
        analyses:
          type: array
          items: {type: string, enum: [total, monthly_average, monthly_max]}
        conditions:
          type: array
          items: {type: string, enum: [always, gt, gte, lt, lte, eq]}
        layouts:
          type: array
          items: {type: string, enum: [statistic, hero]}
        monthly_metrics:
          type: array
          description: Метрики, совместимые с monthly_average и monthly_max.
          items: {type: string, enum: [total_views, favorites, purchases, sales]}
    UpdateAchievementDefinition:
      type: object
      additionalProperties: false
      required: [title, description, icon, metric, condition_operator, is_active]
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 500}
        icon: {type: string, minLength: 1, maxLength: 50, example: 👀}
        metric:
          type: string
          enum: [total_views, favorites, purchases, sales, listing_views, contacts, reviews, activity_days, categories, deals]
        condition_operator:
          type: string
          enum: [always, gt, gte, lt, lte, eq]
        condition_value:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: Обязательно для всех условий, кроме always.
        is_active: {type: boolean}
    AchievementDefinition:
      allOf:
        - $ref: "#/components/schemas/UpdateAchievementDefinition"
        - type: object
          required: [slug, category, sort_order, updated_at]
          properties:
            slug: {type: string, maxLength: 100, pattern: "^[a-z0-9_]+$", example: curious, readOnly: true}
            category: {type: string, example: views, readOnly: true}
            sort_order: {type: integer, minimum: 0, readOnly: true}
            updated_at: {type: string, format: date-time, readOnly: true}
    AchievementDefinitionOptions:
      type: object
      required: [metrics, conditions]
      properties:
        metrics:
          type: array
          items: {type: string, enum: [total_views, favorites, purchases, sales, listing_views, contacts, reviews, activity_days, categories, deals]}
        conditions:
          type: array
          items: {type: string, enum: [always, gt, gte, lt, lte, eq]}
    GenerateRecapRequest:
      type: object
      additionalProperties: false
      required: [user_id, year]
      properties:
        user_id:
          type: string
          format: uuid
        year:
          type: integer
          minimum: 2000
          example: 2026
    SelectMissionRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [sell_three_items, buy_from_favorites, try_avito_delivery]
          example: sell_three_items
    MissionOption:
      type: object
      required: [code, title, description, target, icon, theme, cta]
      properties:
        code:
          type: string
          enum: [sell_three_items, buy_from_favorites, try_avito_delivery]
        title: {type: string, example: Продать три ненужные вещи}
        description: {type: string}
        target: {type: integer, minimum: 1, example: 3}
        icon: {type: string, example: recycle}
        theme: {type: string, example: avito-green}
        cta: {$ref: "#/components/schemas/RecapCardCTA"}
    MissionState:
      type: object
      required:
        - code
        - title
        - description
        - progress
        - target
        - progress_percent
        - status
        - icon
        - theme
        - cta
        - selected_at
        - updated_at
      properties:
        code:
          type: string
          enum: [sell_three_items, buy_from_favorites, try_avito_delivery]
        title: {type: string}
        description: {type: string}
        progress: {type: integer, minimum: 0, example: 1}
        target: {type: integer, minimum: 1, example: 3}
        progress_percent: {type: integer, minimum: 0, maximum: 100, example: 33}
        status:
          type: string
          enum: [active, completed]
        icon: {type: string}
        theme: {type: string}
        cta: {$ref: "#/components/schemas/RecapCardCTA"}
        selected_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        completed_at:
          type: string
          format: date-time
          nullable: true
    MissionOverview:
      type: object
      required: [options, selected]
      properties:
        options:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: "#/components/schemas/MissionOption"}
        selected:
          type: object
          allOf: [{$ref: "#/components/schemas/MissionState"}]
          nullable: true
    CategoryStat:
      type: object
      required: [category, count]
      properties:
        category:
          type: string
          example: Электроника
        count:
          type: integer
          minimum: 0
          example: 300
          description: Количество действий пользователя в категории без весовых коэффициентов.
    Achievement:
      type: object
      required: [slug, title, description, icon, category]
      properties:
        slug:
          type: string
          example: curious
        title:
          type: string
          example: Любопытный
        description:
          type: string
          example: Просмотрел не менее 500 объявлений за год
        icon:
          type: string
          example: 👀
        category:
          type: string
          example: views
    RecapItem:
      type: object
      required: [ad_id, title, category, price]
      properties:
        ad_id: {type: string}
        title: {type: string, example: Смартфон}
        category: {type: string, example: Электроника}
        subcategory: {type: string, example: Смартфоны}
        image_url: {type: string, format: uri}
        price: {type: integer, format: int64, minimum: 0, example: 118000}
    BuyerRecapSummary:
      type: object
      required: [has_data, viewed_ads_count, total_views, favorites_count, chats_count, purchases_count, avito_delivery_purchases]
      properties:
        has_data: {type: boolean}
        viewed_ads_count: {type: integer, minimum: 0}
        total_views: {type: integer, minimum: 0}
        favorites_count: {type: integer, minimum: 0}
        chats_count:
          type: integer
          minimum: 0
          maximum: 0
          deprecated: true
          description: "Всегда 0 в годовых итогах: недатированный chatsCount исключён из расчёта."
        purchases_count: {type: integer, minimum: 0}
        avito_delivery_purchases:
          type: integer
          minimum: 0
          description: Покупки с buy.useAvitoDelivery=true.
        main_category: {type: string}
        largest_purchase:
          type: object
          allOf: [{$ref: "#/components/schemas/RecapItem"}]
          nullable: true
    SellerRecapSummary:
      type: object
      required:
        - has_data
        - listings_count
        - active_listings
        - archived_listings
        - sales_count
        - listing_views
        - likes_received
        - favorites_received
        - contacts_received
        - reviews_count
      properties:
        has_data: {type: boolean}
        listings_count:
          type: integer
          minimum: 0
          description: Только объявления с датой публикации в выбранном году; недатированные записи исключаются.
        active_listings: {type: integer, minimum: 0}
        archived_listings: {type: integer, minimum: 0}
        sales_count: {type: integer, minimum: 0}
        listing_views: {type: integer, minimum: 0}
        likes_received:
          type: integer
          minimum: 0
          maximum: 0
          deprecated: true
          description: "Всегда 0 в годовых итогах: недатированный likes исключён из расчёта."
        favorites_received: {type: integer, minimum: 0}
        contacts_received: {type: integer, minimum: 0}
        reviews_count: {type: integer, minimum: 0}
        average_rating:
          type: number
          format: double
          minimum: 1
          maximum: 5
          nullable: true
        main_category: {type: string}
        star_listing:
          type: object
          allOf: [{$ref: "#/components/schemas/RecapItem"}]
          nullable: true
    CombinedRecapSummary:
      type: object
      required: [has_buyer_data, has_seller_data, categories_count, deals_count]
      properties:
        has_buyer_data: {type: boolean}
        has_seller_data: {type: boolean}
        categories_count: {type: integer, minimum: 0}
        deals_count: {type: integer, minimum: 0}
        main_category: {type: string}
    RecapSummary:
      type: object
      required: [headline, description, buyer, seller, combined]
      properties:
        headline: {type: string, example: Вы были по обе стороны Авито}
        description: {type: string}
        buyer: {$ref: "#/components/schemas/BuyerRecapSummary"}
        seller: {$ref: "#/components/schemas/SellerRecapSummary"}
        combined: {$ref: "#/components/schemas/CombinedRecapSummary"}
    ShareRecapSummary:
      type: object
      required: [headline, description, combined]
      properties:
        headline: {type: string}
        description: {type: string}
        combined: {$ref: "#/components/schemas/CombinedRecapSummary"}
    RecapChartSeries:
      type: object
      required: [key, label, color, values]
      properties:
        key: {type: string, example: views}
        label: {type: string, example: Просмотры}
        color: {type: string, example: avito-blue}
        values:
          type: array
          minItems: 12
          maxItems: 12
          items: {type: integer, minimum: 0}
    RecapChartSegment:
      type: object
      required: [key, label, color, value]
      properties:
        key: {type: string, example: category_1}
        label: {type: string, example: Электроника}
        color: {type: string, example: avito-purple}
        value: {type: integer, minimum: 0, example: 12}
    RecapChartHighlight:
      type: object
      required: [index, label, value]
      properties:
        index: {type: integer, minimum: 0, example: 2}
        label: {type: string, example: Март}
        value: {type: integer, minimum: 0, example: 18}
    RecapVisualization:
      type: object
      required: [version, type]
      properties:
        version: {type: integer, enum: [1]}
        type:
          type: string
          enum: [bar, donut]
        unit: {type: string, example: действий}
        stacked: {type: boolean}
        labels:
          type: array
          items: {type: string}
        series:
          type: array
          items: {$ref: "#/components/schemas/RecapChartSeries"}
        segments:
          type: array
          items: {$ref: "#/components/schemas/RecapChartSegment"}
        highlight:
          type: object
          allOf: [{$ref: "#/components/schemas/RecapChartHighlight"}]
          nullable: true
    RecapCardPresentation:
      type: object
      additionalProperties: false
      required: [layout, theme, icon]
      properties:
        layout:
          type: string
          example: statistic
        theme:
          type: string
          example: avito-purple
        icon:
          type: string
          example: sparkles
    RecapCardCTA:
      type: object
      required: [label, action]
      properties:
        label: {type: string, example: Открыть свежие объявления}
        action: {type: string, example: open_category}
        params:
          type: object
          additionalProperties: {type: string}
          example: {category: Электроника}
    RecapBusinessEvent:
      type: object
      required: [event]
      additionalProperties: false
      properties:
        event:
          type: string
          enum:
            - recap_opened
            - gift_opened
            - slide_viewed
            - recap_completed
            - share_created
            - cta_clicked
            - mission_viewed
            - mission_selected
            - mission_completed
            - mission_cta_clicked
        cta_visible:
          type: boolean
          default: false
          description: Передаётся только для slide_viewed; увеличивает знаменатель CTA CTR.
    RecapCard:
      type: object
      required: [id, kind, title, description, shareable, reason, presentation]
      properties:
        id: {type: string, example: main_interest}
        kind:
          type: string
          enum: [overview, interest, buyer, seller, combined, chart, final]
        eyebrow: {type: string, example: Главный интерес}
        title: {type: string, example: Электроника}
        description: {type: string}
        value: {type: string, example: 12 находок}
        image_url: {type: string, format: uri}
        shareable:
          type: boolean
          description: Backend-флаг; share endpoint сам исключает false-карточки.
        reason:
          type: string
          description: Объяснение, почему карточка вошла в итоговую последовательность.
        presentation: {$ref: "#/components/schemas/RecapCardPresentation"}
        visualization:
          type: object
          allOf: [{$ref: "#/components/schemas/RecapVisualization"}]
          nullable: true
        cta:
          type: object
          allOf: [{$ref: "#/components/schemas/RecapCardCTA"}]
          nullable: true
    RecapMetrics:
      type: object
      required:
        - year
        - total_views
        - total_messages
        - total_favorites
        - total_purchases
        - total_sales
        - top_categories
        - achievements
        - activity_days
        - generated_at
      properties:
        year:
          type: integer
          example: 2026
        total_views:
          type: integer
          minimum: 0
          example: 1500
          description: Количество watch-событий в выбранном году; для старых профилей используется viewCount/lastViewedAt.
        total_messages:
          type: integer
          minimum: 0
          maximum: 0
          example: 0
          deprecated: true
          description: Оставлено для совместимости и всегда равно 0; недатированные чаты не входят в годовой recap.
        total_favorites:
          type: integer
          minimum: 0
          example: 100
          description: Избранное с favoritedAt в выбранном году.
        total_purchases:
          type: integer
          minimum: 0
          example: 10
          description: Покупки с purchasedAt в выбранном году.
        total_sales:
          type: integer
          minimum: 0
          example: 5
          description: Продажи с soldAt в выбранном году.
        top_categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryStat"
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/Achievement"
        activity_days:
          type: integer
          minimum: 0
          maximum: 366
          example: 300
        generated_at:
          type: string
          format: date-time
    Recap:
      allOf:
        - $ref: "#/components/schemas/RecapMetrics"
        - type: object
          required: [id, user_id, summary, cards]
          properties:
            id:
              type: string
              format: uuid
            user_id:
              type: string
              format: uuid
            summary:
              $ref: "#/components/schemas/RecapSummary"
            cards:
              type: array
              items: {$ref: "#/components/schemas/RecapCard"}
    ShareRecap:
      allOf:
        - $ref: "#/components/schemas/RecapMetrics"
        - type: object
          required: [summary, cards]
          properties:
            summary: {$ref: "#/components/schemas/ShareRecapSummary"}
            cards:
              type: array
              description: Только карточки с shareable=true, преобразованные через строгий allowlist.
              items: {$ref: "#/components/schemas/ShareRecapCard"}
    ShareRecapCard:
      type: object
      additionalProperties: false
      required: [kind, eyebrow, title, description, value, presentation]
      description: |-
        Минимальный безопасный контракт экспорта. Название собственного объявления
        заменяется нейтральным текстом; изображение, ID, CTA и диагностические поля запрещены.
      properties:
        kind:
          type: string
          enum: [overview, interest, buyer, seller, combined, chart, final]
        eyebrow: {type: string, example: Главный интерес}
        title: {type: string, example: Электроника}
        description: {type: string}
        value: {type: string, example: 12 находок}
        presentation: {$ref: "#/components/schemas/RecapCardPresentation"}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_request
            message:
              type: string
              example: request body must be valid JSON with user_id and year
            request_id:
              type: string
  responses:
    BadRequest:
      description: Некорректные параметры запроса
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Требуется действующая сессия
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Требуются права администратора
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Логин уже занят
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Внутренняя ошибка сервиса
      content:
